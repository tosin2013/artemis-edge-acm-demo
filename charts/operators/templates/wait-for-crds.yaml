apiVersion: v1
kind: ServiceAccount
metadata:
  name: crd-checker
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-checker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crd-checker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crd-checker
subjects:
  - kind: ServiceAccount
    name: crd-checker
    namespace: {{ .Values.global.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-crds
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: crd-checker
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for AMQ Broker CRD..."
              until oc get crd activemqartemises.broker.amq.io 2>/dev/null; do
                echo "  activemqartemises.broker.amq.io not found, retrying in 10s..."
                sleep 10
              done
              echo "AMQ Broker CRD ready."
              {{- if .Values.keycloak.enabled }}
              echo "Waiting for Keycloak CRD..."
              until oc get crd keycloaks.k8s.keycloak.org 2>/dev/null; do
                echo "  keycloaks.k8s.keycloak.org not found, retrying in 10s..."
                sleep 10
              done
              echo "Keycloak CRD ready."
              {{- end }}
              echo "All required CRDs are registered."
