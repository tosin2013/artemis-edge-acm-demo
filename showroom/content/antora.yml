name: artemis-edge-acm
title: Artemis Edge ACM Demo
version: "1.0"
nav:
  - modules/ROOT/nav.adoc
asciidoc:
  attributes:
    openshift_cluster_ingress_domain: "%openshift_cluster_ingress_domain%"
    openshift_api_url: "%openshift_api_url%"
    login_command: "%login_command%"
    user: "%user%"
    password: "%password%"
    guid: "%guid%"
    amq_console_url: "https://hub-01-broker-wconsj-0-svc-rte-artemis.{openshift_cluster_ingress_domain}"
    keycloak_url: "https://keycloak-ingress-keycloak.{openshift_cluster_ingress_domain}"
    grafana_url: "https://grafana-open-cluster-management-observability.{openshift_cluster_ingress_domain}"
    producer_user: "alice"
    producer_password: "bosco"
    consumer_user: "bob"
    consumer_password: "bosco"
    # mode_multi_hub is intentionally NOT set here.
    # In single-hub mode (default), ifdef::mode_multi_hub[] guards evaluate false.
    # For multi-hub deployments, patch-showroom-mode.sh injects
    # mode_multi_hub: "true" into the showroom-userdata ConfigMap,
    # which yq merges into this file at build time.
