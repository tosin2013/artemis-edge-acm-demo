<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Red Hat Text, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="#FAFAFA" rx="8"/>

  <!-- ═══════════ LAYER 3: Inter-Cluster Fleet ═══════════ -->
  <rect x="30" y="20" width="1040" height="130" rx="8" fill="#E8F5E9" stroke="#4A7C2E" stroke-width="1.5"/>
  <text x="550" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#2E5B1B">LAYER 3 — Inter-Cluster Fleet</text>
  <text x="550" y="64" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Kustomize + ApplicationSets  (already exists in fleet-gitops/)</text>

  <!-- Fleet boxes -->
  <rect x="60" y="80" width="240" height="55" rx="6" fill="#4A7C2E" filter="url(#shadow)"/>
  <text x="180" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ApplicationSet</text>
  <text x="180" y="121" text-anchor="middle" font-size="11" fill="#C8E6C9">fleet-gitops/hubs/ → Regional Hubs</text>

  <rect x="430" y="80" width="240" height="55" rx="6" fill="#4A7C2E" filter="url(#shadow)"/>
  <text x="550" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ACM Policies</text>
  <text x="550" y="121" text-anchor="middle" font-size="11" fill="#C8E6C9">fleet-gitops/platform/ → enforcement</text>

  <rect x="800" y="80" width="240" height="55" rx="6" fill="#4A7C2E" filter="url(#shadow)"/>
  <text x="920" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ApplicationSet</text>
  <text x="920" y="121" text-anchor="middle" font-size="11" fill="#C8E6C9">fleet-gitops/amq/ → SNO edges</text>

  <!-- ═══════════ LAYER 1: Root App of Apps ═══════════ -->
  <rect x="30" y="180" width="700" height="130" rx="8" fill="#FFEBEE" stroke="#CC0000" stroke-width="1.5"/>
  <text x="380" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#8B0000">LAYER 1 — Root App of Apps</text>
  <text x="380" y="224" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Kustomize — selects which child apps deploy per cluster role</text>

  <rect x="60" y="240" width="280" height="55" rx="6" fill="#CC0000" filter="url(#shadow)"/>
  <text x="200" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Global Hub</text>
  <text x="200" y="281" text-anchor="middle" font-size="12" fill="#FFCDD2">apps/overlays/global-hub/</text>

  <rect x="420" y="240" width="280" height="55" rx="6" fill="#CC0000" filter="url(#shadow)"/>
  <text x="560" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Regional Hub</text>
  <text x="560" y="281" text-anchor="middle" font-size="12" fill="#FFCDD2">apps/overlays/regional-hub/</text>

  <!-- SNO box -->
  <rect x="800" y="240" width="240" height="55" rx="6" fill="#E67300" filter="url(#shadow)"/>
  <text x="920" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SNO Edge Clusters</text>
  <text x="920" y="281" text-anchor="middle" font-size="12" fill="#FFE0B2">Managed by regional hubs</text>

  <!-- ═══════════ LAYER 2: Domain Apps ═══════════ -->
  <rect x="30" y="370" width="1040" height="390" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="550" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#0D3B7A">LAYER 2 — Domain Apps</text>
  <text x="550" y="414" text-anchor="middle" font-size="12" fill="#555" font-style="italic">One ArgoCD Application per operational concern</text>

  <!-- Kustomize sub-label -->
  <text x="230" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0">KUSTOMIZE DOMAINS</text>

  <!-- operators -->
  <rect x="60" y="460" width="220" height="90" rx="6" fill="#2D7DC6" filter="url(#shadow)"/>
  <text x="170" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">operators</text>
  <text x="170" y="505" text-anchor="middle" font-size="11" fill="#BBDEFB">Subscriptions</text>
  <text x="170" y="520" text-anchor="middle" font-size="11" fill="#BBDEFB">Namespaces, OperatorGroups</text>
  <text x="170" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#FFE082">⚡ wave 0 — deploys first</text>

  <!-- observability -->
  <rect x="310" y="460" width="220" height="90" rx="6" fill="#2D7DC6" filter="url(#shadow)"/>
  <text x="420" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">observability</text>
  <text x="420" y="505" text-anchor="middle" font-size="11" fill="#BBDEFB">Dashboards, Metrics allowlist</text>
  <text x="420" y="520" text-anchor="middle" font-size="11" fill="#BBDEFB">Regional + Fleet tier overlays</text>
  <text x="420" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#FFE082">wave 1</text>

  <!-- Helm sub-label -->
  <text x="780" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#0D3B7A">HELM DOMAINS</text>

  <!-- messaging -->
  <rect x="560" y="460" width="220" height="90" rx="6" fill="#1A3F8F" filter="url(#shadow)"/>
  <text x="670" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">messaging</text>
  <text x="670" y="505" text-anchor="middle" font-size="11" fill="#90CAF9">Broker CRs, OIDC config</text>
  <text x="670" y="520" text-anchor="middle" font-size="11" fill="#90CAF9">TLS certs, address patterns</text>
  <text x="670" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#FFE082">wave 1 — after CRDs ready</text>

  <!-- auth -->
  <rect x="810" y="460" width="220" height="90" rx="6" fill="#1A3F8F" filter="url(#shadow)"/>
  <text x="920" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">auth</text>
  <text x="920" y="505" text-anchor="middle" font-size="11" fill="#90CAF9">Keycloak, PostgreSQL</text>
  <text x="920" y="520" text-anchor="middle" font-size="11" fill="#90CAF9">Realm import, secrets</text>
  <text x="920" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#FFE082">wave 1 — after CRDs ready</text>

  <!-- workshop -->
  <rect x="560" y="590" width="220" height="80" rx="6" fill="#1A3F8F" filter="url(#shadow)"/>
  <text x="670" y="616" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">workshop</text>
  <text x="670" y="635" text-anchor="middle" font-size="11" fill="#90CAF9">Showroom, User RBAC</text>
  <text x="670" y="653" text-anchor="middle" font-size="10" font-weight="600" fill="#FFE082">wave 2 — after brokers + auth</text>

  <!-- ═══════════ ARROWS ═══════════ -->

  <!-- Fleet → Layer 1 -->
  <line x1="180" y1="135" x2="200" y2="240" stroke="#4A7C2E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="188" font-size="11" fill="#4A7C2E" font-weight="600">pushes config</text>

  <line x1="550" y1="135" x2="560" y2="240" stroke="#4A7C2E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="188" font-size="11" fill="#4A7C2E" font-weight="600">enforces</text>

  <line x1="920" y1="135" x2="920" y2="240" stroke="#4A7C2E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="942" y="188" font-size="11" fill="#4A7C2E" font-weight="600">pulls to SNOs</text>

  <!-- Global Hub → domains -->
  <line x1="140" y1="295" x2="120" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="295" x2="380" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Regional Hub → domains (all 5) -->
  <line x1="450" y1="295" x2="220" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="295" x2="460" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="295" x2="670" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="295" x2="880" y2="460" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="295" x2="670" y2="590" stroke="#CC0000" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- CRD dependency (dashed) -->
  <line x1="170" y1="550" x2="620" y2="490" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <line x1="170" y1="550" x2="820" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="60" y="600" width="440" height="140" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="622" font-size="13" font-weight="700" fill="#333">Legend</text>

  <line x1="80" y1="640" x2="120" y2="640" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="644" font-size="12" fill="#333">Root selects child app (solid = direct, dashed = wave 2)</text>

  <line x1="80" y1="662" x2="120" y2="662" stroke="#4A7C2E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="666" font-size="12" fill="#4A7C2E">Fleet layer pushes / enforces / pulls</text>

  <line x1="80" y1="684" x2="120" y2="684" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <text x="130" y="688" font-size="12" fill="#666">CRD dependency — operators must be healthy first</text>

  <rect x="80" y="700" width="14" height="14" rx="2" fill="#2D7DC6"/>
  <text x="100" y="712" font-size="12" fill="#333">Kustomize domain</text>
  <rect x="240" y="700" width="14" height="14" rx="2" fill="#1A3F8F"/>
  <text x="260" y="712" font-size="12" fill="#333">Helm domain</text>
  <rect x="370" y="700" width="14" height="14" rx="2" fill="#4A7C2E"/>
  <text x="390" y="712" font-size="12" fill="#333">Fleet layer</text>
</svg>
