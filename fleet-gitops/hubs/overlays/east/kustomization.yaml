apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: amq-fleet
    patch: |-
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: fleet-east
