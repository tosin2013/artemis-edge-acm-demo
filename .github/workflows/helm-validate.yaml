name: Helm Chart Validation

on:
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'
      - '.github/workflows/helm-validate.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm lint
        run: helm lint .

      - name: Helm template (smoke test)
        run: |
          helm template test . \
            --set global.clusterDomain=ci-test.example.com \
            --set global.clusterApiUrl=https://api.ci-test.example.com:6443
