global:
  mode: "single-hub"
  clusterDomain: ""
  clusterApiUrl: ""
  namespace: "artemis"

amqBrokerOperator:
  enabled: true
  channel: "7.12.x"
  source: "redhat-operators"

hubBrokers:
  - name: hub-01
    adminUser: admin
    adminPassword: admin
    replicas: 1
    persistenceEnabled: false
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "1000m"
        memory: "2Gi"

edgeBrokers:
  - name: spoke-01
    region: NY
    hubConnections:
      - hub: hub-01
        autoStart: true
      - hub: hub-02
        autoStart: false
  - name: spoke-02
    region: NJ
    hubConnections:
      - hub: hub-01
        autoStart: true
      - hub: hub-02
        autoStart: false
  - name: spoke-03
    region: CT
    hubConnections:
      - hub: hub-01
        autoStart: true
      - hub: hub-02
        autoStart: false

edgeBrokerDefaults:
  adminUser: admin
  adminPassword: admin
  replicas: 1
  persistenceEnabled: false
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"

keycloak:
  enabled: true
  namespace: "keycloak"
  instances: 1
  db:
    username: admin
    password: admin
    database: keycloak
  clientSecret: "artemis-broker-secret"

monitoring:
  enabled: true
  acmObservability:
    enabled: true

globalHub:
  enabled: false

fleetThanosQuery:
  enabled: false
  regionalStores: []

showroom:
  enabled: true
  contentRepoUrl: ""
  contentRepoRef: "main"
  terminalImage: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
  terminalRbac: []

workshop:
  users:
    - user1
    - user2

externalSecrets:
  enabled: false
  gcpProjectID: ""
  gcpSASecretName: "gcp-sm-credentials"
  gcpSASecretNamespace: "external-secrets"

spokeProvisioning:
  enabled: false
  baseDomain: ""
  gcpProjectID: ""
  gcpRegion: "us-east1"
  clusterImageSet: "img4.22.12-x86-64-appsub"
  sshPublicKey: ""
  networkType: "OVNKubernetes"
  workerMachineType: "n2-standard-8"
  masterMachineType: "n2-standard-8"
  # Empty by default. An empty overlay (clusters: []) must not coalesce back to
  # workshop SNO names. deploy-spokes.sh creates Hive ClusterDeployments in
  # Module 2; pass clusters explicitly if Helm should emit ManagedCluster CRs.
  clusters: []

tls:
  enabled: false
  certManager:
    enabled: true
    issuerRef: ""
  hubKeystoreBase64: ""
  hubTruststoreBase64: ""
  spokeKeystoreBase64: ""
  spokeTruststoreBase64: ""
  keystorePassword: "password"
  truststorePassword: "password"
