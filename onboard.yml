# onboard.yml — Onboarding manifest for artemis-edge-acm-demo
# Spec version 1.0 — conforms to project-onboard manifest-spec.md
#
# Single source of truth for prerequisites, setup, config, and validation.
# bootstrap.sh reads this file at runtime via python3 + PyYAML.

name: artemis-edge-acm-demo
description: AMQ Broker edge federation on RHACM-managed SNO clusters
deploy_script: scripts/deploy.sh

# ─────────────────────────────────────────────────────────────
# Prerequisites
# ─────────────────────────────────────────────────────────────

prerequisites:
  - name: python3
    check_command: "python3 --version"
    version_regex: "Python (\\d+\\.\\d+)"
    min_version: "3.9"
    install:
      rhel9: "sudo dnf install -y python3"
      macos: "brew install python@3.12"
      fedora: "sudo dnf install -y python3"
      debian: "sudo apt-get install -y python3"
      fallback: "Install Python 3.9+ from https://python.org"

  - name: python3.12
    check_command: "python3.12 --version"
    version_regex: "Python (\\d+\\.\\d+)"
    min_version: "3.12"
    install:
      rhel9: "sudo dnf install -y python3.12"
      macos: "brew install python@3.12"
      fedora: "sudo dnf install -y python3.12"
      debian: "sudo apt-get install -y python3.12"
      fallback: "Install Python 3.12+ (required by agd setup)"

  - name: podman
    check_command: "podman --version"
    version_regex: "podman version (\\d+\\.\\d+)"
    install:
      rhel9: "sudo dnf install -y podman"
      macos: "brew install podman"
      fedora: "sudo dnf install -y podman"
      debian: "sudo apt-get install -y podman"
      fallback: "Install Podman from https://podman.io"

  - name: git
    check_command: "git --version"
    install:
      rhel9: "sudo dnf install -y git"
      macos: "brew install git"
      fedora: "sudo dnf install -y git"
      debian: "sudo apt-get install -y git"

  - name: oc
    check_command: "oc version --client"
    install:
      fallback: "Install from https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/"

  - name: helm
    check_command: "helm version --short"
    install:
      rhel9: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      macos: "brew install helm"
      fedora: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      debian: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      fallback: "Install Helm 3 from https://helm.sh/docs/intro/install/"

  - name: jq
    check_command: "jq --version"
    install:
      rhel9: "sudo dnf install -y jq"
      macos: "brew install jq"
      fedora: "sudo dnf install -y jq"
      debian: "sudo apt-get install -y jq"

  - name: gcloud
    check_command: "gcloud --version"
    install:
      fallback: "Install from https://cloud.google.com/sdk/docs/install"

  - name: keytool
    check_command: "keytool 2>&1 | head -1"
    install:
      rhel9: "sudo dnf install -y java-21-openjdk-devel"
      macos: "brew install openjdk@21"
      fedora: "sudo dnf install -y java-21-openjdk-devel"
      debian: "sudo apt-get install -y openjdk-21-jdk"
      fallback: "Install Java JDK 21+ (keytool is included)"

  - name: java
    check_command: "java -version 2>&1 | head -1"
    version_regex: "version \"(\\d+)"
    min_version: "21"
    install:
      rhel9: "sudo dnf install -y java-21-openjdk-devel"
      macos: "brew install openjdk@21"
      fedora: "sudo dnf install -y java-21-openjdk-devel"
      debian: "sudo apt-get install -y openjdk-21-jdk"
      fallback: "Install OpenJDK 21+"

  - name: mvn
    check_command: "mvn -version"
    install:
      fallback: "Install Apache Maven from https://maven.apache.org/download.cgi"

# ─────────────────────────────────────────────────────────────
# Setup Steps
# ─────────────────────────────────────────────────────────────

setup_steps:
  - name: "Clone AgnosticD v2"
    check: "test -x ${agnosticd_root}/bin/agd"
    action: "git clone https://github.com/tosin2013/agnosticd-v2.git ${agnosticd_root} && cd ${agnosticd_root} && git remote add upstream https://github.com/rhpds/agnosticd-v2.git"
    prompt_var: agnosticd_root
    prompt: "AgnosticD v2 install path"
    default: "~/Development/agnosticd-v2"

  - name: "Run agd setup"
    check: "test -d ${agnosticd_root}/../agnosticd-v2-virtualenv"
    action: "cd ${agnosticd_root} && PATH=\"$HOME/bin:$PATH\" ./bin/agd setup"

  - name: "Sync vars to agnosticd-v2-vars"
    check: "diff -q agnosticd/gcp/vars.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp.yml 2>/dev/null"
    action: "mkdir -p ${agnosticd_root}/../agnosticd-v2-vars && cp agnosticd/gcp/vars.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp.yml && cp agnosticd/gcp/vars-multihub.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub.yml && cp agnosticd/gcp/vars-multihub-regional.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-regional.yml && cp agnosticd/gcp/vars-multihub-central.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-central.yml && cp agnosticd/gcp/vars-multihub-west.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-west.yml"

  - name: "Copy GCP key to secrets"
    check: "test -f ${agnosticd_root}/../agnosticd-v2-secrets/gcp-key-${agd_guid}.json"
    action: "mkdir -p ${agnosticd_root}/../agnosticd-v2-secrets && cp ${gcp_key_path} ${agnosticd_root}/../agnosticd-v2-secrets/gcp-key-${agd_guid}.json"

  - name: "Generate secrets from GCP key"
    check: "python3 -c \"import yaml; s=yaml.safe_load(open('${agnosticd_root}/../agnosticd-v2-secrets/secrets-${agd_account}.yml')); assert '${agd_guid}' in s.get('base_domain','')\""
    action: "scripts/generate-secrets.sh ${gcp_key_path} ${agd_guid} ${agd_account} ${agnosticd_root}"

  - name: "Generate TLS certificates"
    check: "test -f artemis/tls/hub-01-broker-keystore.jks"
    action: "KC_DOMAIN=${hub_domain} HUB01_DOMAIN=${hub_domain} HUB02_DOMAIN=${hub02_domain:-${hub_domain}} ./scripts/generate-tls.sh"

  - name: "Build Java clients"
    check: "ls java/amqp-client/target/*.jar 2>/dev/null"
    action: "cd java/amqp-client && mvn package -DskipTests && cd ../mqtt-client && mvn package -DskipTests && cd ../amqp-bridge && mvn package -DskipTests"

# ─────────────────────────────────────────────────────────────
# Configuration Prompts
# ─────────────────────────────────────────────────────────────

config:
  output_file: config.yml
  gitignore: true

  prompts:
    - key: mode
      prompt: "Deployment mode"
      default: "single-hub"
      choices: ["single-hub", "multi-hub"]

    - key: cloud_provider
      prompt: "Cloud provider"
      default: "gcp"
      choices: ["gcp", "azure"]

    - key: agd_guid
      prompt: "GCP sandbox ID (5-char OpenEnv ID, e.g. sbhtd). In multi-hub mode, cluster GUIDs are derived: global-X, east-X, cen-X, west-X"
      required: true

    - key: agd_account
      prompt: "AgnosticD account name"
      default: "openenv-gcp"

    - key: hub_domain
      prompt: "Hub cluster ingress domain"
      # Mode 1 (single-hub): apps.hub.{guid}.gcp.redhatworkshops.io
      # Mode 2 (multi-hub): apps.hub.{sandbox}.gcp.redhatworkshops.io (no tier prefix for global)
      # bootstrap.sh overrides this default based on mode selection.
      default: "apps.hub.${agd_guid}.gcp.redhatworkshops.io"
      required: true

    - key: hub02_domain
      prompt: "Second hub domain (single-hub only; ignored in multi-hub where each hub derives its own domain)"

    - key: spoke_count
      prompt: "Number of edge SNO clusters"
      default: "3"

    - key: keycloak_client_secret
      prompt: "Keycloak broker client secret"
      required: true
      sensitive: true

    - key: ocp_version
      prompt: "Target OpenShift version"
      default: "4.22"

    - key: agnosticd_root
      prompt: "AgnosticD v2 install path"
      default: "~/Development/agnosticd-v2"

    - key: gcp_key_path
      prompt: "Path to GCP service account JSON key"
      default: "~/gcp-service-account.json"
      required: true

    - key: gcp_quota_region
      prompt: "GCP region for OpenShift cluster quota check (T0 us-east1, east us-east4, central us-central1, west us-west1)"
      default: "us-east1"

# ─────────────────────────────────────────────────────────────
# Validation Checks
# ─────────────────────────────────────────────────────────────

validation:
  - name: "Helm template renders"
    command: "helm template . --values values.yaml"
    required: true
    fail_message: "Helm chart must render cleanly"

  - name: "TLS keystores exist"
    command: "test -f artemis/tls/hub-01-broker-keystore.jks"
    required: true
    fail_message: "Run scripts/generate-tls.sh first"

  - name: "AgnosticD agd binary"
    command: "test -x ${agnosticd_root}/bin/agd"
    required: true
    fail_message: "AgnosticD v2 not found. Re-run setup or clone tosin2013/agnosticd-v2"

  - name: "AgnosticD virtualenv"
    command: "test -d ${agnosticd_root}/../agnosticd-v2-virtualenv"
    required: true
    fail_message: "Run: cd ${agnosticd_root} && ./bin/agd setup"

  - name: "Vars file in agnosticd-v2-vars"
    command: "test -f ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp.yml"
    required: true
    fail_message: "Copy vars: cp agnosticd/gcp/vars.yml ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp.yml"

  - name: "Multi-hub vars files (Mode 2)"
    command: "test '${mode}' != 'multi-hub' || (test -f ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub.yml && test -f ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-regional.yml && test -f ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-central.yml && test -f ${agnosticd_root}/../agnosticd-v2-vars/artemis-edge-gcp-multihub-west.yml)"
    required: true
    fail_message: "Multi-hub vars files missing. Re-run setup step 'Sync vars to agnosticd-v2-vars' or copy manually from agnosticd/gcp/"

  - name: "Cert-manager zone fix script (Mode 2)"
    command: "test '${mode}' != 'multi-hub' || test -x scripts/fix-cert-manager-zone.sh"
    required: true
    fail_message: "scripts/fix-cert-manager-zone.sh must exist and be executable for Mode 2 cert-manager workaround"

  - name: "Post-provision finalize script (Mode 2)"
    command: "test '${mode}' != 'multi-hub' || test -x scripts/post-provision-multihub.sh"
    required: true
    fail_message: "scripts/post-provision-multihub.sh must exist and be executable for Mode 2 hub import"

  - name: "Cloud CLI authenticated"
    command: "gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -1 | grep -q ."
    required: true
    fail_message: "Authenticate: gcloud auth activate-service-account --key-file=<key.json>"

  - name: "GCP secrets file"
    command: "test -f ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${agd_account}.yml"
    required: true
    fail_message: "Secrets file missing. Copy agnosticd/gcp/secrets.yml.example to agnosticd-v2-secrets/"

  - name: "GCP service account key"
    command: "find ${agnosticd_root}/../agnosticd-v2-secrets -name 'gcp-key-*.json' | head -1 | grep -q ."
    required: true
    fail_message: "GCP service account JSON key not found in agnosticd-v2-secrets/"

  - name: "GCP service account key PEM integrity"
    command: "python3 scripts/validate-gcp-key.py ${agnosticd_root}/../agnosticd-v2-secrets/gcp-key-${agd_guid}.json"
    required: true
    fail_message: "GCP key PEM is damaged (likely rewrapped by an editor). Run: python3 scripts/validate-gcp-key.py <key.json> for details. Do not hand-edit the PEM — re-download from GCP console."

  - name: "OpenShift login"
    command: "oc whoami"
    required: false
    fail_message: "Not logged into OpenShift (expected before first deployment)"

  - name: "RHACM installed"
    command: "oc get mch -A --no-headers 2>/dev/null | grep -q ."
    required: false
    fail_message: "RHACM not yet installed (will be deployed by workloads)"

  - name: "ArgoCD healthy"
    command: "oc get route openshift-gitops-server -n openshift-gitops -o jsonpath='{.spec.host}' 2>/dev/null | grep -q ."
    required: false
    fail_message: "OpenShift GitOps not found (will be deployed by workloads)"

  - name: "All workloads synced"
    command: "scripts/validate-deployment.sh"
    required: false
    fail_message: "Post-deploy validation failed. Run: scripts/validate-deployment.sh for details"

# ─────────────────────────────────────────────────────────────
# Quota Checks (Phase 5b) — OpenShift cluster capacity, not SNOs.
# Spoke N2 checks stay in scripts/deploy-spokes.sh (Module 2).
# Mode 1 / single-hub: one region (gcp_quota_region) needs 100 N2 vCPUs.
# Mode 2 / multi-hub: 4 regions — us-east1 (T0-global), us-east4 (east),
#   us-central1 (central), us-west1 (west). Each needs ≈132 N2 vCPUs.
# SSD: T0 = 8 x 500 GiB node + 50 bastion; regional = similar.
# ─────────────────────────────────────────────────────────────

quota_checks:
  # --- Single-hub / Mode 1 checks (gcp_quota_region) ---
  - label: "GCP N2 vCPUs (${gcp_quota_region})"
    needed: 132
    limit_command: >-
      gcloud compute regions describe ${gcp_quota_region} --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    usage_command: >-
      gcloud compute regions describe ${gcp_quota_region} --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    fail_message: >-
      Need 132 free N2 vCPUs in ${gcp_quota_region} for Mode 2 T0 (3 control-plane + 5 workers
      n2-standard-16 + n2-standard-4 bastion). T1 and Mode 1 need 100. Request a quota
      increase on Open Environment project openenv-${agd_guid}.

  - label: "GCP SSD GB (${gcp_quota_region})"
    needed: 4050
    limit_command: >-
      gcloud compute regions describe ${gcp_quota_region} --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    usage_command: >-
      gcloud compute regions describe ${gcp_quota_region} --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    fail_message: >-
      Need 4050 GiB SSD in ${gcp_quota_region} for Mode 2 T0 (8 x 500 GiB node disks + 50 GiB
      bastion). T1 needs 3050. Request a quota increase on openenv-${agd_guid}.

  # --- Mode 2: additional regional quota checks (east, central, west) ---
  # These only apply when mode=multi-hub. The test short-circuits in single-hub.
  - label: "GCP N2 vCPUs (us-east4 — east hub, Mode 2 only)"
    needed: 132
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-east4 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    usage_command: >-
      gcloud compute regions describe us-east4 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    fail_message: >-
      Need 132 free N2 vCPUs in us-east4 for Mode 2 east regional hub.
      Request a quota increase on openenv-${agd_guid}.

  - label: "GCP SSD GB (us-east4 — east hub, Mode 2 only)"
    needed: 4050
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-east4 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    usage_command: >-
      gcloud compute regions describe us-east4 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    fail_message: >-
      Need 4050 GiB SSD in us-east4 for Mode 2 east hub. Request a quota increase on openenv-${agd_guid}.

  - label: "GCP N2 vCPUs (us-central1 — central hub, Mode 2 only)"
    needed: 132
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-central1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    usage_command: >-
      gcloud compute regions describe us-central1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    fail_message: >-
      Need 132 free N2 vCPUs in us-central1 for Mode 2 central hub.
      Request a quota increase on openenv-${agd_guid}.

  - label: "GCP SSD GB (us-central1 — central hub, Mode 2 only)"
    needed: 4050
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-central1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    usage_command: >-
      gcloud compute regions describe us-central1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    fail_message: >-
      Need 4050 GiB SSD in us-central1 for Mode 2 central hub. Request a quota increase on openenv-${agd_guid}.

  - label: "GCP N2 vCPUs (us-west1 — west hub, Mode 2 only)"
    needed: 132
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-west1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    usage_command: >-
      gcloud compute regions describe us-west1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='N2_CPUS'), 0))"
    fail_message: >-
      Need 132 free N2 vCPUs in us-west1 for Mode 2 west hub.
      Request a quota increase on openenv-${agd_guid}.

  - label: "GCP SSD GB (us-west1 — west hub, Mode 2 only)"
    needed: 4050
    condition: "${mode} == multi-hub"
    limit_command: >-
      gcloud compute regions describe us-west1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('limit',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    usage_command: >-
      gcloud compute regions describe us-west1 --project=openenv-${agd_guid}
      --format='json(quotas)' | python3 -c "import json,sys; qs=(json.load(sys.stdin).get('quotas') or []); print(next((int(q.get('usage',0)) for q in qs if q.get('metric')=='SSD_TOTAL_GB'), 0))"
    fail_message: >-
      Need 4050 GiB SSD in us-west1 for Mode 2 west hub. Request a quota increase on openenv-${agd_guid}.

# ─────────────────────────────────────────────────────────────
# Post-Setup Message
# ─────────────────────────────────────────────────────────────

post_setup:
  message: |
    Setup complete! Next steps:

    1. Edit your GCP secrets file:
       ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${agd_account}.yml

    2. Deploy:

       Mode 1 (single-hub):
         ./scripts/deploy.sh --guid ${agd_guid} --account ${agd_account}

       Mode 2 (multi-hub — 4 clusters: global, east, central, west):
         # Provision each tier (Global Hub T0 first, then regional hubs):
         cd ${agnosticd_root}
         ./bin/agd provision -g global-${agd_guid} -c artemis-edge-gcp-multihub -a ${agd_account}
         ./bin/agd provision -g east-${agd_guid} -c artemis-edge-gcp-multihub-regional -a ${agd_account}
         ./bin/agd provision -g cen-${agd_guid} -c artemis-edge-gcp-multihub-central -a ${agd_account}
         ./bin/agd provision -g west-${agd_guid} -c artemis-edge-gcp-multihub-west -a ${agd_account}
         # After all 4 are up, finalize:
         cd <repo_root>
         ./scripts/post-provision-multihub.sh ${agd_guid}
         # Or use the wrapper:
         ./scripts/deploy.sh --mode multi-hub --sandbox ${agd_guid} --account ${agd_account}

    3. After provisioning, deployment-info.yml is updated automatically.
       To refresh manually:
         Mode 1: ./scripts/save-deployment-info.sh ${agd_guid}
         Mode 2: ./scripts/save-deployment-info.sh --mode multi-hub --sandbox ${agd_guid}

    4. Destroy when finished:
         Mode 1: ./scripts/deploy.sh --destroy --guid ${agd_guid} --account ${agd_account}
         Mode 2: ./scripts/deploy.sh --destroy --mode multi-hub --sandbox ${agd_guid} --account ${agd_account}

# ─────────────────────────────────────────────────────────────
# Modes (dev = maintainers, prod = end users)
# ─────────────────────────────────────────────────────────────

modes:
  dev:
    description: "Set up maintainer/contributor development environment"
    phases: [prerequisites, setup_steps, config, validation]
    extra_prerequisites:
      - name: shellcheck
        check_command: "command -v shellcheck"
        install:
          rhel9: "sudo dnf install -y ShellCheck"
          macos: "brew install shellcheck"
          fedora: "sudo dnf install -y ShellCheck"
          debian: "sudo apt-get install -y shellcheck"
          fallback: "Install ShellCheck from https://www.shellcheck.net/"
      - name: yamllint
        check_command: "command -v yamllint"
        install:
          rhel9: "pip3 install yamllint"
          macos: "brew install yamllint"
          fedora: "sudo dnf install -y yamllint"
          debian: "sudo apt-get install -y yamllint"
          fallback: "pip3 install yamllint"
  prod:
    description: "Set up and deploy for end users"
    phases: [prerequisites, setup_steps, config, validation, deploy]
    # Mode 1:
    post_validation_command: "./scripts/deploy.sh --guid ${agd_guid} --account ${agd_account}"
    # Mode 2 (when mode=multi-hub):
    post_validation_command_multihub: "./scripts/deploy.sh --mode multi-hub --sandbox ${agd_guid} --account ${agd_account}"
