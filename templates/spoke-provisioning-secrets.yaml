{{- if .Values.spokeProvisioning.enabled }}
{{- range .Values.spokeProvisioning.clusters }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
{{- if $.Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}-gcp-creds
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-gcp-creds
    creationPolicy: Owner
  data:
    - secretKey: osServiceAccount.json
      remoteRef:
        key: gcp-sa-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}-pull-secret
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .pullSecret }}` }}"
  data:
    - secretKey: pullSecret
      remoteRef:
        key: ocp-pull-secret
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-install-config
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
type: Opaque
stringData:
  install-config.yaml: |
    apiVersion: v1
    metadata:
      name: {{ .name }}
    baseDomain: {{ $.Values.spokeProvisioning.baseDomain }}
    controlPlane:
      hyperthreading: Enabled
      name: master
      replicas: 1
      platform:
        gcp:
          type: {{ $.Values.spokeProvisioning.masterMachineType }}
    compute:
    - hyperthreading: Enabled
      name: worker
      replicas: 0
      platform:
        gcp:
          type: {{ $.Values.spokeProvisioning.workerMachineType }}
    networking:
      networkType: {{ $.Values.spokeProvisioning.networkType }}
      clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
      machineNetwork:
      - cidr: 10.0.0.0/16
      serviceNetwork:
      - 172.30.0.0/16
    platform:
      gcp:
        projectID: {{ $.Values.spokeProvisioning.gcpProjectID }}
        region: {{ $.Values.spokeProvisioning.gcpRegion }}
    pullSecret: ""
    sshKey: {{ $.Values.spokeProvisioning.sshPublicKey | quote }}
{{- end }}
{{- end }}
