{{- if .Values.globalHub.enabled }}
# -----------------------------------------------------------------------
# ArgoCD Application that deploys the fleet-gitops/ Kustomize tree.
# This creates the AppProject, ApplicationSet (hubs), Placements, and
# Policies that fan out regional hub configuration from Global Hub.
# Sync-wave 5 ensures the RHACM-to-ArgoCD bridge resources (wave 0)
# are in place first so the hubs ApplicationSet has cluster secrets.
# -----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-gitops
  namespace: openshift-gitops
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL | default "https://github.com/tosin2013/artemis-edge-acm-demo.git" | quote }}
    targetRevision: {{ .Values.gitops.revision | default "main" | quote }}
    path: fleet-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
{{- end }}
