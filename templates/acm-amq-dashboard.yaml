{{- if and .Values.monitoring.enabled (index .Values.monitoring "acmObservability" | default dict).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: artemis-amq-broker-dashboard
  namespace: open-cluster-management-observability
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    grafana-custom-dashboard: "true"
data:
  artemis-amq-broker.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false
              },
              "decimals": 0,
              "min": 0,
              "unit": "short"
            }
          },
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_message_count{cluster=~\"$cluster\"}", "legendFormat": "Total ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "A" },
            { "datasource": { "type": "prometheus" }, "expr": "artemis_delivering_message_count{cluster=~\"$cluster\"}", "legendFormat": "Delivering ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "C" },
            { "datasource": { "type": "prometheus" }, "expr": "artemis_scheduled_message_count{cluster=~\"$cluster\"}", "legendFormat": "Scheduled ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "D" }
          ],
          "title": "Queue Message Counts",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "id": 14,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_messages_acknowledged{cluster=~\"$cluster\"}", "legendFormat": "Acked ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "A" },
            { "datasource": { "type": "prometheus" }, "expr": "artemis_messages_added{cluster=~\"$cluster\"}", "legendFormat": "Added ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "B" }
          ],
          "title": "Messages Added & Acked",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "description": "Number of clients currently connected to this server.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "id": 8,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_connection_count{cluster=~\"$cluster\"}", "legendFormat": "{{ "{{" }}broker{{ "}}" }}", "refId": "A" }
          ],
          "title": "Connection Count",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "decbytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 12,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_delivering_persistent_size{cluster=~\"$cluster\"}", "legendFormat": "Delivering ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "B" },
            { "datasource": { "type": "prometheus" }, "expr": "artemis_persistent_size{cluster=~\"$cluster\"}", "legendFormat": "Total ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }})", "refId": "D" }
          ],
          "title": "Queue Sizes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 10,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_unrouted_message_count{cluster=~\"$cluster\"}", "legendFormat": "Unrouted ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }})", "refId": "A" },
            { "datasource": { "type": "prometheus" }, "expr": "artemis_routed_message_count{cluster=~\"$cluster\"}", "legendFormat": "Routed ({{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }})", "refId": "B" }
          ],
          "title": "Address Message Counts",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "decbytes"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 32 },
          "id": 6,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_address_memory_usage{cluster=~\"$cluster\"}", "legendFormat": "{{ "{{" }}broker{{ "}}" }}", "refId": "A" }
          ],
          "title": "Address Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "pointSize": 5, "showPoints": "never" },
              "decimals": 0, "min": 0, "unit": "short"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 32 },
          "id": 2,
          "targets": [
            { "datasource": { "type": "prometheus" }, "expr": "artemis_consumer_count{cluster=~\"$cluster\"}", "legendFormat": "{{ "{{" }}broker{{ "}}" }} - {{ "{{" }}address{{ "}}" }}::{{ "{{" }}queue{{ "}}" }}", "refId": "A" }
          ],
          "title": "Consumer Count",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["artemis", "amq-broker"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus" },
            "definition": "label_values(artemis_message_count, cluster)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "cluster",
            "query": { "query": "label_values(artemis_message_count, cluster)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s","10s","30s","1m","5m","15m","30m","1h","2h","1d"] },
      "timezone": "",
      "title": "AMQ Broker - Artemis Edge",
      "uid": "artemis_amq_broker_acm",
      "version": 1
    }
{{- end }}
