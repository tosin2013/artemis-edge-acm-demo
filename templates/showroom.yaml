{{- if .Values.showroom.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-userdata
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
data:
  user_data.yml: |
    "openshift_cluster_ingress_domain": {{ .Values.global.clusterDomain | quote }}
    "openshift_api_url": {{ .Values.global.clusterApiUrl | default (printf "https://api.%s:6443" (.Values.global.clusterDomain | replace "apps." "")) | quote }}
    "console_url": {{ printf "https://console-openshift-console.%s" .Values.global.clusterDomain | quote }}
    "guid": {{ ((.Values.deployer).guid) | default "demo" | quote }}
    "user": "admin"
    "password": "admin"
    {{- if eq (default "" .Values.global.mode) "multi-hub" }}
    "mode_multi_hub": "true"
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-terminal
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showroom-terminal-cluster-admin
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: showroom-terminal
    namespace: showroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    app: showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showroom
  template:
    metadata:
      labels:
        app: showroom
    spec:
      serviceAccountName: showroom-terminal
      containers:
        - name: showroom-content
          image: {{ .Values.showroom.contentImage | default "quay.io/rhpds/showroom-content:v1.4.2" | quote }}
          ports:
            - containerPort: 8000
          env:
            - name: GIT_REPO_URL
              value: {{ .Values.showroom.contentRepoUrl | default "https://github.com/tosin2013/artemis-edge-acm-demo.git" | quote }}
            - name: GIT_REPO_REF
              value: {{ .Values.showroom.contentRepoRef | quote }}
            - name: CONTENT_PATH
              value: "showroom"
            - name: PLAYBOOK
              value: "showroom/site.yml"
          volumeMounts:
            - name: userdata
              mountPath: /user_data
        - name: showroom-terminal
          image: {{ .Values.showroom.terminalImage | quote }}
          ports:
            - containerPort: 7681
          env:
            - name: HOME
              value: /home/lab-user
            - name: MAVEN_USER_HOME
              value: /home/lab-user/.m2
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/home/lab-user
            - name: MAVEN_OPTS
              value: -Dmaven.repo.local=/home/lab-user/.m2/repository
      volumes:
        - name: userdata
          configMap:
            name: showroom-userdata
---
apiVersion: v1
kind: Service
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  selector:
    app: showroom
  ports:
    - name: content
      port: 8080
      targetPort: 8000
    - name: terminal
      port: 7681
      targetPort: 7681
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    {{- include "artemis-edge.userinfoLabel" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: showroom
  port:
    targetPort: content
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
