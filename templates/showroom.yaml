{{- if .Values.showroom.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-userdata
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
data:
  user_data.yml: |
    "openshift_cluster_ingress_domain": {{ .Values.global.clusterDomain | quote }}
    "openshift_api_url": {{ .Values.global.clusterApiUrl | default (printf "https://api.%s:6443" (.Values.global.clusterDomain | replace "apps." "")) | quote }}
    "console_url": {{ printf "https://console-openshift-console.%s" .Values.global.clusterDomain | quote }}
    "guid": {{ ((.Values.deployer).guid) | default "demo" | quote }}
    "sandbox_guid": {{ ((.Values.deployer).sandboxGuid) | default (((.Values.deployer).guid) | default "demo") | quote }}
    "user": "admin"
    "password": "admin"
    {{- if eq (default "" .Values.global.mode) "multi-hub" }}
    "mode_multi_hub": "true"
    "global_hub_api_url": {{ .Values.globalHub.apiUrl | default "" | quote }}
    "global_hub_console_url": {{ .Values.globalHub.consoleUrl | default "" | quote }}
    "global_hub_password": {{ .Values.globalHub.password | default "" | quote }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-proxy-config
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      proxy_cache off;
      expires -1;

      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }

      server {
        listen 8080;
        absolute_redirect off;

        location / {
          proxy_pass http://localhost:8000/;
          proxy_http_version 1.1;
        }

        location /terminal/ {
          proxy_pass http://localhost:7681/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showroom-terminal
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showroom-terminal-cluster-admin
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: showroom-terminal
    namespace: showroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    app: showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showroom
  template:
    metadata:
      labels:
        app: showroom
    spec:
      serviceAccountName: showroom-terminal
      containers:
        - name: nginx
          image: {{ .Values.showroom.proxyImage | default "quay.io/rhpds/nginx:1.25" | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
        - name: showroom-content
          image: {{ .Values.showroom.contentImage | default "quay.io/rhpds/showroom-content:v1.4.2" | quote }}
          ports:
            - containerPort: 8000
          env:
            - name: GIT_REPO_URL
              value: {{ .Values.showroom.contentRepoUrl | default "https://github.com/tosin2013/artemis-edge-acm-demo.git" | quote }}
            - name: GIT_REPO_REF
              value: {{ .Values.showroom.contentRepoRef | quote }}
            - name: CONTENT_PATH
              value: "showroom"
            - name: PLAYBOOK
              value: "showroom/site.yml"
          volumeMounts:
            - name: userdata
              mountPath: /user_data
        - name: showroom-terminal
          image: {{ .Values.showroom.terminalImage | quote }}
          ports:
            - containerPort: 7681
          env:
            - name: HOME
              value: /home/lab-user
            - name: MAVEN_USER_HOME
              value: /home/lab-user/.m2
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/home/lab-user
            - name: MAVEN_OPTS
              value: -Dmaven.repo.local=/home/lab-user/.m2/repository
      volumes:
        - name: userdata
          configMap:
            name: showroom-userdata
        - name: nginx-config
          configMap:
            name: showroom-proxy-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  selector:
    app: showroom
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: showroom
  namespace: showroom
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    {{- include "artemis-edge.userinfoLabel" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: showroom
  port:
    targetPort: proxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
