{{- if .Values.showroom.terminalRbac }}
{{- range .Values.showroom.terminalRbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showroom-terminal-{{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount | default "showroom" }}
    namespace: {{ .namespace }}
{{- end }}
{{- end }}
