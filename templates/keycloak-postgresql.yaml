{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  serviceName: postgresql
  selector:
    matchLabels:
      app: postgresql
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15
          volumeMounts:
            - mountPath: /data
              name: cache-volume
          env:
            - name: POSTGRES_USER
              value: {{ .Values.keycloak.db.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.keycloak.db.password | quote }}
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.keycloak.db.database | quote }}
      volumes:
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  selector:
    app: postgresql
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
