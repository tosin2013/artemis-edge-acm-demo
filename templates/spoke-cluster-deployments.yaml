{{- /*
Spoke cluster resources managed by ArgoCD.
ClusterDeployments are NOT included here — they are created and owned
by deploy-spokes.sh because Hive's admission webhook rejects any
modification to provisioned ClusterDeployments, causing permanent
ArgoCD OutOfSync. See #38.
*/ -}}
{{- if .Values.spokeProvisioning.enabled }}
{{- range .Values.spokeProvisioning.clusters }}
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
    name: {{ .name }}
    cloud: GCP
    vendor: OpenShift
    sites: edge-sno
    edge-region: {{ .region }}
    cloud-provider: gcp
spec:
  hubAcceptsClient: true
---
apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig
metadata:
  name: {{ .name }}
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
spec:
  clusterName: {{ .name }}
  clusterNamespace: {{ .name }}
  clusterLabels:
    cloud: GCP
    vendor: OpenShift
  applicationManager:
    enabled: true
  certPolicyController:
    enabled: true
  iamPolicyController:
    enabled: true
  policyController:
    enabled: true
  searchCollector:
    enabled: true
{{- end }}
{{- end }}
