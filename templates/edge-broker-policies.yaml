{{- /*
#48 option C + #51: AMQ on SNOs via isolated ACM policies, with SNO→hub
AMQP federation over hub-01 AMQPS (serving cert -ptls). ApplicationSet
artemis-edge-workloads stays unbound (do not bind ztp-policies).
Hub spoke-* brokers are unchanged. SNO path uses admin/admin (no JAAS copy).
*/ -}}
{{- if .Values.spokeProvisioning.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  clusterSet: default
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-amq-broker-operator-sno
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: amq-broker-operator-sno
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ .Values.global.namespace }}
                  labels:
                    demo.redhat.com/application: "artemis-edge-acm"
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: amq-broker-og
                  namespace: {{ .Values.global.namespace }}
                spec:
                  targetNamespaces:
                    - {{ .Values.global.namespace }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: amq-broker-rhel8
                  namespace: {{ .Values.global.namespace }}
                spec:
                  channel: {{ .Values.amqBrokerOperator.channel | quote }}
                  installPlanApproval: Automatic
                  name: amq-broker-rhel8
                  source: {{ .Values.amqBrokerOperator.source }}
                  sourceNamespace: openshift-marketplace
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-amq-broker-operator-sno-placement
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            sites: "edge-sno"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-amq-broker-operator-sno-binding
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
placementRef:
  name: policy-amq-broker-operator-sno-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-amq-broker-operator-sno
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- if and .Values.monitoring.enabled (index .Values.monitoring "acmObservability" | default dict).enabled }}
---
# SNO AMQ ServiceMonitors live in the artemis namespace (UWL Prometheus).
# The default metrics-collector federates prometheus-k8s only, so SNO artemis_*
# never reaches Thanos until user-workload monitoring is on and
# uwl-metrics-collector starts. Merge enableUserWorkload into the existing
# cluster-monitoring-config (ACM already injects alert-forwarding there).
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-sno-uwl-amq-metrics
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: sno-enable-user-workload
        spec:
          remediationAction: enforce
          severity: medium
          object-templates-raw: |
{{ `            {{- $cmo := (lookup "v1" "ConfigMap" "openshift-monitoring" "cluster-monitoring-config") }}
            {{- $cy := dict }}
            {{- if and $cmo $cmo.data }}
              {{- $raw := index $cmo.data "config.yaml" }}
              {{- if $raw }}
                {{- $cy = $raw | fromYaml }}
              {{- end }}
            {{- end }}
            {{- if not $cy }}
              {{- $cy = dict }}
            {{- end }}
            {{- $_ := set $cy "enableUserWorkload" true }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: cluster-monitoring-config
                  namespace: openshift-monitoring
                data:
                  config.yaml: |
                    {{ $cy | toYaml | autoindent }}
` }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: sno-uwl-amq-allowlist
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: observability-metrics-custom-allowlist
                  namespace: {{ .Values.global.namespace }}
                data:
                  uwl_metrics_list.yaml: |
                    names:
                      - artemis_message_count
                      - artemis_messages_added
                      - artemis_messages_acknowledged
                      - artemis_connection_count
                      - artemis_address_memory_usage
                      - artemis_consumer_count
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-sno-uwl-amq-metrics-placement
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            sites: "edge-sno"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-sno-uwl-amq-metrics-binding
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
placementRef:
  name: policy-sno-uwl-amq-metrics-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-sno-uwl-amq-metrics
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
{{- $defaults := .Values.edgeBrokerDefaults }}
{{- range .Values.edgeBrokers }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-amq-broker-{{ .name }}
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
    edge-region: {{ .region | quote }}
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: amq-broker-{{ .name }}
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: broker.amq.io/v1beta1
                kind: ActiveMQArtemis
                metadata:
                  name: {{ .name }}-broker
                  namespace: {{ $.Values.global.namespace }}
                  labels:
                    demo.redhat.com/application: "artemis-edge-acm"
                    edge-region: {{ .region | quote }}
                spec:
                  adminUser: {{ $defaults.adminUser | quote }}
                  adminPassword: {{ $defaults.adminPassword | quote }}
                  deploymentPlan:
                    size: {{ $defaults.replicas }}
                    persistenceEnabled: {{ $defaults.persistenceEnabled }}
                    journalType: nio
                    enableMetricsPlugin: true
                    resources:
                      limits:
                        cpu: {{ $defaults.resources.limits.cpu | quote }}
                        memory: {{ $defaults.resources.limits.memory | quote }}
                      requests:
                        cpu: {{ $defaults.resources.requests.cpu | quote }}
                        memory: {{ $defaults.resources.requests.memory | quote }}
                  acceptors:
                    - name: core-acceptor
                      protocols: core
                      port: 61616
                    - name: amqp-acceptor
                      protocols: amqp
                      port: 5672
                    - name: mqtt-acceptor
                      protocols: mqtt
                      port: 1833
                    - name: amqps-acceptor
                      protocols: amqp
                      port: 5671
                      sslEnabled: true
                      sslSecret: amqps-acceptor-ptls
                      needClientAuth: false
                      expose: true
                  brokerProperties:
                    {{- include "artemis-edge.snoFederationBrokerProperties" (dict "spoke" . "Values" $.Values) | nindent 20 }}
                  resourceTemplates:
                    - selector:
                        kind: Service
                        name: {{ .name }}-broker-amqps-acceptor-0-svc
                      annotations:
                        service.beta.openshift.io/serving-cert-secret-name: amqps-acceptor-ptls
                  console:
                    expose: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ .name }}-broker-auth
                  namespace: {{ $.Values.global.namespace }}
                type: Opaque
                stringData:
                  user: {{ $defaults.adminUser | quote }}
                  password: {{ $defaults.adminPassword | quote }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: {{ .name }}-broker-prometheus-0-svc
                  namespace: {{ $.Values.global.namespace }}
                  labels:
                    ActiveMQArtemis: {{ .name }}-broker
                    application: {{ .name }}-broker-app
                    application-type: artemis
                    service-type: prometheus
                    edge-region: {{ .region | quote }}
                spec:
                  ports:
                    - name: metrics
                      protocol: TCP
                      port: 8161
                      targetPort: 8161
                  type: ClusterIP
                  selector:
                    ActiveMQArtemis: {{ .name }}-broker
                    application: {{ .name }}-broker-app
                    statefulset.kubernetes.io/pod-name: {{ .name }}-broker-ss-0
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: {{ .name }}-broker-service-monitor
                  namespace: {{ $.Values.global.namespace }}
                  labels:
                    ActiveMQArtemis: {{ .name }}-broker
                    application: {{ .name }}-broker-app
                    application-type: artemis
                spec:
                  jobLabel: ActiveMQArtemis
                  selector:
                    matchLabels:
                      application: {{ .name }}-broker-app
                      application-type: artemis
                      service-type: prometheus
                  namespaceSelector:
                    matchNames:
                      - {{ $.Values.global.namespace }}
                  endpoints:
                    - port: metrics
                      scheme: http
                      followRedirects: true
                      basicAuth:
                        password:
                          name: {{ .name }}-broker-auth
                          key: password
                        username:
                          name: {{ .name }}-broker-auth
                          key: user
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-amq-broker-{{ .name }}-placement
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            sites: "edge-sno"
            edge-region: {{ .region | quote }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-amq-broker-{{ .name }}-binding
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" $ | nindent 4 }}
placementRef:
  name: policy-amq-broker-{{ .name }}-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-amq-broker-{{ .name }}
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-block-spoke-01-federation
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
    edge-region: "NY"
spec:
  remediationAction: enforce
  disabled: true
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: block-spoke-01-federation
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: block-spoke-01-federation
                  namespace: {{ .Values.global.namespace }}
                spec:
                  podSelector:
                    matchLabels:
                      ActiveMQArtemis: spoke-01-broker
                  policyTypes:
                    - Egress
                  egress:
                    - to:
                        - podSelector:
                            matchLabels:
                              ActiveMQArtemis: spoke-01-broker
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-block-spoke-01-federation-placement
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            sites: "edge-sno"
            edge-region: "NY"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-block-spoke-01-federation-binding
  namespace: edge-broker-policies
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
placementRef:
  name: policy-block-spoke-01-federation-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-block-spoke-01-federation
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
