{{- if .Values.amqBrokerOperator.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.amqBrokerOperator.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.amqBrokerOperator.channel | quote }}
  installPlanApproval: Automatic
  name: {{ .Values.amqBrokerOperator.name }}
  source: {{ .Values.amqBrokerOperator.source }}
  sourceNamespace: openshift-marketplace
{{- end }}
