{{- /*
Workshop user RBAC — observability read (cluster-reader misses these APIs)
and namespaced producer rights for Module 4 `oc -n artemis run`.
Deployed in sync-wave 5 so RBAC CRDs are guaranteed present.
Do not widen workshop-observability-reader to pod create.
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-observability-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - observability.open-cluster-management.io
    resources:
      - multiclusterobservabilities
      - observabilityaddon
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - prometheusrules
      - podmonitors
      - alertmanagers
      - prometheuses
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-users-observability-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-observability-reader
subjects:
  {{- include "artemis-edge.workshopUserSubjects" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-artemis-producer
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-artemis-producer
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workshop-artemis-producer
subjects:
  {{- include "artemis-edge.workshopUserSubjects" . | nindent 2 }}
{{- if eq (default "" .Values.global.mode) "multi-hub" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-global-hub-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclusters
      - managedclustersets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applicationsets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - operator.open-cluster-management.io
    resources:
      - multiclusterhubs
      - multiclusterglobalhubs
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
      - clusterserviceversions
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - addon.open-cluster-management.io
    resources:
      - managedclusteraddons
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-users-global-hub-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-global-hub-reader
subjects:
  {{- include "artemis-edge.workshopUserSubjects" . | nindent 2 }}
{{- end }}
---
{{- /* Broad read-only ClusterRole for all demo modules (1–8).
       Covers ACM policies, AMQ CRDs, routes, placements, Hive CDs,
       operator subscriptions, ArgoCD apps, and core resources the
       modules ask students to inspect. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-demo-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - policy.open-cluster-management.io
    resources:
      - policies
      - placementbindings
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - broker.amq.io
    resources:
      - activemqartemises
      - activemqartemisaddresses
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
      - clusterserviceversions
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclusters
      - managedclustersets
      - placements
      - placementdecisions
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - hive.openshift.io
    resources:
      - clusterdeployments
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applicationsets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - operator.open-cluster-management.io
    resources:
      - multiclusterhubs
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - addon.open-cluster-management.io
    resources:
      - managedclusteraddons
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - secrets
      - services
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-users-demo-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "artemis-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-demo-reader
subjects:
  {{- include "artemis-edge.workshopUserSubjects" . | nindent 2 }}
