global:
  mode: "multi-hub"
  hubTier: regional
  # Overlay per region: east | central | west
  region: east

# One AMQ hub broker on this regional ACM hub (not on Global Hub).
hubBrokers:
  - name: hub-01
    adminUser: admin
    adminPassword: admin
    replicas: 1
    persistenceEnabled: false
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "1000m"
        memory: "2Gi"

globalHub:
  enabled: false

fleetThanosQuery:
  enabled: false

# Student SNOs (Module 2). AgnosticD does not create these clusters.
spokeProvisioning:
  enabled: true
  baseDomain: ""
  gcpProjectID: ""
  gcpRegion: "us-east1"
  clusterImageSet: "img4.22.12-x86-64-appsub"
  sshPublicKey: ""
  networkType: "OVNKubernetes"
  workerMachineType: "n2-standard-8"
  masterMachineType: "n2-standard-8"
  # Empty: chart values.yaml defaults are also empty. deploy-spokes.sh adds
  # clusters after Module 2. Do not pre-create SNOs at provision time.
  clusters: []

edgeBrokers:
  - name: spoke-01
    region: NY
    hubConnections:
      - hub: hub-01
        autoStart: true
  - name: spoke-02
    region: NJ
    hubConnections:
      - hub: hub-01
        autoStart: true
